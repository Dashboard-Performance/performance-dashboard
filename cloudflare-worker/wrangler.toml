name = "performance-dashboard-sync-cache"
main = "worker.js"
compatibility_date = "2024-01-01"

# Keep plain-text variables that were set in the Cloudflare dashboard (otherwise `wrangler deploy` deletes them).
keep_vars = true

# v1.1.47: بعد ما شلنا الـ General Sync (21 شيت) من الـ Worker خالص، بقى
# شغل الـ scheduled() handler خفيف جدًا (Main + Confirmed by Day + Incentive
# Merchants بس، مفيش CPU error خالص عليهم) — فقدرنا نقلل الفاصل من 5 دقايق
# لدقيقة واحدة من غير أي خطورة (الـ Worker مالوش سقف تنفيذات يومي زي Apps
# Script، وعدد الطلبات ده لسه بعيد جدًا عن أي حد مجاني عند Cloudflare).
# ⚠️ لو انت بتنشر بلصق الكود يدوي من Dashboard (مش wrangler deploy)، السطر
# ده هنا مجرد مرجع — لازم كمان تعدّل الـ Cron Trigger من نفس صفحة الـ Worker
# على Cloudflare: Triggers tab → Cron Triggers → عدّل من */5 * * * * لـ
# * * * * *.
[triggers]
crons = ["* * * * *"]

# ⚠️ لازم تستبدل الـ id ده بالـ id الحقيقي اللي هتاخده من أمر:
#   wrangler kv namespace create "SYNC_CACHE"
# (راجع الشرح فوق worker.js لخطوات كاملة)
[[kv_namespaces]]
binding = "SYNC_CACHE"
id = "0352049f347a42f1823b5dd1425bd413"

[vars]
# Release upload (Control > Targets/Upload): the GitHub repo + branch the Worker pushes new versions to.
# GITHUB_TOKEN and RELEASE_SECRET are secrets (set with `wrangler secret put`), not here.
GITHUB_REPO = "Dashboard-Performance/performance-dashboard"
GITHUB_BRANCH = "main"

# رابط الـ Apps Script Web App بتاعك — نفسه المستخدم في js/app.js (DATA_API_URL)
# وjs/auth.js (CONFIG.API_URL). لو غيرت الـ deployment بتاع الباك اند يوم من
# الأيام، لازم تحدّث القيمة هنا كمان.
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJw0dlXgmSt9E04YYcMzvLln0M1NQpraPvuFcxDiE5VnHLR4HWfMJAlMsJzmO1deDaGg/exec"

# آي دي الشيت نفسه (نفس القيمة اللي في js/app.js — SHEET_ID) — الـ Worker
# بيستخدمه عشان يقرا تاب "Confirmed by Day" (action=getConfirmedByDay)
# مباشرة من Google Sheets (gviz)، من غير ما يعدي على Apps Script خالص.
SHEET_ID = "1Vg8P1EL5y_FqQSR7_uDI1XtB-gDe0Bkj7IqbiOzNgxA"

# v1.14.0 — Invite emails (Control > Users & Roles). Sent through Resend from a
# no-reply address. Setup: 1) verify your sending domain in Resend,
# 2) Worker secret RESEND_API_KEY, 3) set MAIL_FROM below, e.g.
#    MAIL_FROM = "Taager Dashboard <no-reply@yourdomain.com>"
MAIL_FROM = "Taager Dashboard <no-reply@mail.taager.app>"
DECLINE_DIGEST = "on"   # v1.17.0 Decline Matches daily email from the dashboard (12:00 Cairo): "test" = only DIGEST_TEST_TO · "on" = whole team · "off"
DIGEST_TEST_TO = "youssef.hanafy@taager.com"
PLANNER_DOH_EXPORT = "on"   # Planner DOH -> planning sheet, 11:00 Cairo
SUPPLY_CONVERSION_EXPORT = "on"   # v1.17.0 — Supply conversion -> its own sheet every day at 11:30 Cairo ("off" to stop)
INV_CATEGORY_EXPORT = "on"   # v1.17.0 — Inventory & DOH per category -> its own tab every day at 11:45 Cairo ("off" to stop)
DASHBOARD_URL = "https://center-control.taager.app/"   # the link inside invite emails

# v1.16.2 — Merchant invites: the merchant portal address. Merchant-role invites create the portal account and email a link to it.
PORTAL_URL = "https://merchants.taager.app"

# v1.17.0 — Shared snapshot (cold start). The dashboard pushes the gzipped snapshot here and
# anyone opening it with an empty browser cache paints from it instantly instead of waiting
# out the full sheet load. Create the bucket once:
#   npx wrangler r2 bucket create taager-dashboard-snapshot
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "taager-dashboard-snapshot"

[observability]
enabled = true

# v1.17.0 — Command Loop
# 1) npx wrangler d1 create taager-command-loop   → paste the database_id below
[[d1_databases]]
binding = "LOOP_DB"
database_name = "taager-command-loop"
database_id = "44178cfb-2469-4f79-a213-f39ef10a4c6a"

# The scoring engine reads the whole Main query twice a day (Workers Paid plan — the portal already needs it).
[limits]
cpu_ms = 300000
